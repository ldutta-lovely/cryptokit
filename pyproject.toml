[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptokit"
version = "0.1.0"
description = "A fast, modular Python toolkit for solving CTF cryptography challenges"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Antigravity CTF Team" }]
dependencies = [
    "pycryptodome>=3.18.0",
    "sympy>=1.12",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
fast = [
    "gmpy2>=2.1.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cryptokit = "cryptokit.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptokit*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
